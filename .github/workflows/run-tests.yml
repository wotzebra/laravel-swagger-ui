name: run-tests

on:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4, 8.5, 8.6]
        laravel: ['11.*', '12.*', '13.*']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          # Laravel 13.32 is the first release whose session handlers implement create_sid() for PHP 8.6.
          - php: 8.6
            laravel: 13.*
            framework: ^13.32
        exclude:
          - php: 8.4
            laravel: 11.*
            dependency-version: prefer-lowest
          # Laravel 11 and 12 session handlers are missing create_sid(), which PHP 8.6 deprecates.
          - php: 8.6
            laravel: 11.*
          - php: 8.6
            laravel: 12.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Update apt
        run: sudo apt-get update --fix-missing

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: yaml

      - name: Get Composer cache cirectory
        id: composer-cache
        run: |
          echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.framework || matrix.laravel }}" --no-interaction --no-update
          composer config --global policy.advisories.block false
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-suggest

      - name: Execute tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover
